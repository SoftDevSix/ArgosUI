name: Build and Push Docker Image

on:
  push:
    branches:
      - production

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        env:
          DOCKER_USERNAME: argoscs
          IMAGE_NAME: argoscs/ui
          VITE_FILE_MANAGER_API_BASE_URL: ${{ vars.VITE_ARGOS_API_BASE_URL}}
          VITE_ARGOS_API_BASE_URL: ${{ vars.VITE_ARGOS_API_BASE_URL}}
        run: |
          echo "Building Docker image..."
          docker build -t ${IMAGE_NAME} -f Dockerfile.prod . --build-arg VITE_FILE_MANAGER_API_BASE_URL=${VITE_FILE_MANAGER_API_BASE_URL} --build-arg VITE_ARGOS_API_BASE_URL=${VITE_ARGOS_API_BASE_URL}

          echo "Pushing Docker image..."
          docker push ${IMAGE_NAME}
